services:
  hub:
    build:
      context: .
      args:
        APP: hub
    init: true
    restart: unless-stopped

  met:
    build:
      context: .
      args:
        APP: met
    init: true
    restart: unless-stopped

  trial:
    build:
      context: .
      args:
        APP: trial
    init: true
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    ports:
      # Host 80 so the apps are reachable at a bare http://localhost/. Override
      # with HTTP_PORT=8080 (or any free port) if something else holds 80.
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/shiny_proxy.conf:/etc/nginx/shiny_proxy.conf:ro
    depends_on:
      - hub
      - met
      - trial
    restart: unless-stopped
