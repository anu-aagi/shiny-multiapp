# The cleartext listener. In production this sits behind ANU's F5 load
# balancer, which forwards public traffic to ports 80 and 443 on the host.

# What scheme the client actually used. Behind the F5 this container's own
# $scheme describes the hop from the load balancer, not the browser's request,
# so prefer the forwarded header whenever the F5 has set it. Shiny is handed
# this (see shiny_proxy.conf) so it never has to guess.
map $http_x_forwarded_proto $client_scheme {
    default                 $scheme;
    "~*^(https|http)$"      $http_x_forwarded_proto;
}

# -- Usage telemetry -----------------------------------------------------------
#
# One JSON object per request on stdout, which podman passes to the journal
# under the shiny-proxy unit; deploy/telemetry.sh turns it into numbers per app.
# It is built from traffic the proxy already sees, so every app behind it is
# counted without the app doing anything. Defined here because this file is
# conf.d/default.conf, which nginx reads before conf.d/tls.conf -- a log format
# has to exist before an access_log line can name it.

# The app is the first path segment, so an app added to app_routes.conf is
# counted without anything here having to change.
map $uri $app_name {
    "~^/(?<app_segment>[^/]+)/"     $app_segment;
    default                         "-";
}

# What the request is, for counting:
#   session  Shiny's websocket. The browser opens one per session and nginx
#            logs it when it closes, so its duration is the session's length.
#   page     the app's HTML page itself: one per page load.
#   asset    scripts, stylesheets, fonts -- twenty-odd for every page load.
#   other    the bare / and /met-style redirects, and anything unrouted.
map $uri $request_kind {
    "~^/[^/]+/websocket/$"          session;
    "~^/[^/]+/$"                    page;
    "~^/[^/]+/."                    asset;
    default                         other;
}

# Sessions and page loads are always logged; assets and redirects only when
# they fail. A page load already implies its assets, and logging them would
# multiply the volume twentyfold in a journal that also holds the system's own.
map "$request_kind:$status" $log_request {
    "~^(session|page):"             1;
    "~:[45]"                        1;
    default                         0;
}

# The client's network, not its address: the last IPv4 octet zeroed, or an
# IPv6 address cut to its first three groups. Enough to tell visitors apart
# roughly, not enough to identify one -- the apps serve the public, and a full
# address is personal information the platform has no use for.
map $remote_addr $client_network {
    "~^(?<ipv4_net>\d+\.\d+\.\d+)\.\d+$"                    $ipv4_net.0;
    "~*^(?<ipv6_net>[0-9a-f]+:[0-9a-f]+:[0-9a-f]+):"        $ipv6_net::;
    default                                                 "-";
}

# Behind the F5, $remote_addr is the load balancer, so every visitor shares
# one network above. Uncomment once ANU IT confirm the F5's source addresses
# and that it sets X-Forwarded-For. Trust nothing wider than those addresses:
# anyone else could then write their own entry into the log.
# set_real_ip_from <F5 source range>;
# real_ip_header   X-Forwarded-For;

log_format telemetry escape=json
    '{"time":"$time_iso8601","ts":$msec,'
    '"app":"$app_name","kind":"$request_kind",'
    '"method":"$request_method","path":"$uri","status":$status,'
    '"seconds":$request_time,"upstream_seconds":"$upstream_response_time",'
    '"bytes":$bytes_sent,"client":"$client_network","scheme":"$client_scheme",'
    '"referer":"$http_referer","user_agent":"$http_user_agent"}';

server {
    listen 80;

    access_log /dev/stdout telemetry if=$log_request;

    # Issue redirects as relative paths. nginx builds absolute ones from its own
    # listening port, which is 80 inside the container -- so when the container
    # is published on any other port, every redirect below would send the
    # browser to port 80, where nothing is listening.
    absolute_redirect off;

    # Send cleartext clients to HTTPS, but only when the F5 has told us the
    # browser's original request was http. An unconditional redirect here would
    # loop forever in the usual arrangement where the F5 terminates TLS and
    # forwards the request on as plain HTTP: nginx would bounce every already-
    # secure request back to https, and the F5 would forward it here again.
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    include /etc/nginx/app_routes.conf;
}
