server {
    listen 80;

    # Land visitors on the hub rather than a 404
    location = / { return 302 /hub/; }

    # Shiny emits relative asset URLs (e.g. "bootstrap-3.4.1/css/..."), so a
    # missing trailing slash would resolve them against / and break the page.
    location = /hub   { return 301 /hub/; }
    location = /met   { return 301 /met/; }
    location = /trial { return 301 /trial/; }

    # The trailing slash on proxy_pass is what strips the /appN/ prefix before
    # forwarding, so each app can keep serving from its own root.
    location /hub/ {
        proxy_pass http://hub:3838/;
        include /etc/nginx/shiny_proxy.conf;
    }

    location /met/ {
        proxy_pass http://met:3838/;
        include /etc/nginx/shiny_proxy.conf;
    }

    location /trial/ {
        proxy_pass http://trial:3838/;
        include /etc/nginx/shiny_proxy.conf;
    }
}
