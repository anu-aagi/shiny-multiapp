# The TLS listener, for the case where the F5 re-encrypts to this machine
# rather than forwarding cleartext to port 80.
#
# This file is mounted only where the certificate exists -- nginx refuses to
# start if ssl_certificate points at a missing file, so local `docker compose`
# runs with nginx.conf alone and serves plain HTTP. See docker-compose.yml.
#
# The certificate here only secures the hop from the load balancer, so a
# self-signed one is enough unless the F5 is configured to verify it. The
# public certificate for aagi-apps.anu.edu.au lives on the F5.

server {
    listen 443 ssl;
    http2 on;

    absolute_redirect off;

    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:5m;
    ssl_session_timeout 1h;

    include /etc/nginx/app_routes.conf;
}
