# Shared proxy settings for every Shiny app location.
# Shiny holds a websocket open for the life of the session, so the connection
# must be upgradable and the read timeout long enough not to cut it.

proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "upgrade";
proxy_read_timeout 20d;

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

# Not $scheme: behind the F5, $scheme is the cleartext hop from the load
# balancer rather than what the browser asked for. $client_scheme (defined in
# nginx.conf) prefers the F5's own header and falls back to $scheme when there
# is no load balancer in front, as when running locally.
proxy_set_header X-Forwarded-Proto $client_scheme;
